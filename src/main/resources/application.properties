spring.application.name=sprint_adso_68_apoyo

# MySQL - ajusta usuario/clave según tu entorno
spring.datasource.url=jdbc:mysql://localhost:3306/sprint_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT - cambia el secret en producción (mínimo 32 caracteres)
app.jwt.secret=cambia-este-secret-por-uno-muy-largo-de-al-menos-64-caracteres-1234567890
app.jwt.expiration-ms=86400000
